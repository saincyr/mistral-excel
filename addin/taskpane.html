<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mistral Assistant</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px;
         background: #fafafa; height: 100%; display: flex; flex-direction: column; }
  header { background: #fa500f; color: #fff; padding: 10px 12px; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { padding: 8px 10px; border-radius: 10px; margin-bottom: 8px;
         white-space: pre-wrap; word-break: break-word; max-width: 95%; }
  .user { background: #fa500f; color: #fff; margin-left: 15%; }
  .bot  { background: #fff; border: 1px solid #e0e0e0; }
  .log  { color: #666; font-size: 11px; margin-top: 4px; }
  .err  { background: #fdecea; border: 1px solid #f5c6cb; color: #721c24; }
  #bar { padding: 8px; border-top: 1px solid #ddd; background: #fff; }
  #input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;
           resize: none; font: inherit; }
  #send { margin-top: 6px; width: 100%; padding: 8px; border: 0; border-radius: 6px;
          background: #fa500f; color: #fff; font-weight: 600; cursor: pointer; }
  #send:disabled { background: #ccc; }
  #keyrow { padding: 8px; background: #fff; border-bottom: 1px solid #eee; }
  #key { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  details { padding: 4px 8px; font-size: 11px; color: #888; }
  summary { cursor: pointer; }
</style>
</head>
<body>
<header>🤖 Mistral Chat</header>
<div id="keyrow">
  <input id="key" type="password" placeholder="Mistral API key (console.mistral.ai)" />
</div>
<div id="chat"></div>
<div id="bar">
  <textarea id="input" rows="2" placeholder="e.g. In C2, compute YoY growth per SKU and format results"></textarea>
  <button id="send">Send</button>
</div>
<details><summary>Context sent with each prompt</summary><pre id="ctx" style="font-size:10px"></pre></details>

<script>
let MISTRAL_KEY = localStorage.getItem("mistral_key") || "";
const MODEL = "mistral-small-latest";

const SYSTEM_PROMPT = `You are an assistant embedded in the user's Excel workbook via Office.js.
You receive live workbook context (sheet names, used ranges, headers, sample values, current selection) and a user prompt.
Reply ONLY with JSON, no markdown:
{"reply":"short answer in the user's language","actions":[...]}
Allowed actions:
- {"type":"writeFormula","sheet":"...","cell":"C2","formula":"=SUMIFS(...)"}
- {"type":"writeValues","sheet":"...","cell":"A1","values":[["a","b"],["c","d"]]}
- {"type":"clearRange","sheet":"...","range":"C2:E10"}
- {"type":"formatRange","sheet":"...","range":"A1:A10","format":{"numberFormat":"0.0%","bold":true,"fillColor":"FFE699"}}
Formulas: EN syntax, comma separators. Only reference sheets from the context. Never invent sheet names.`;

// ---------- workbook context ----------
async function getContext() {
  return Excel.run(async (ctx) => {
    const wb = ctx.workbook;
    wb.load("name");
    const sheets = wb.worksheets;
    sheets.load("items/name,items/position");
    const sel = wb.getSelectedRange();
    sel.load("address,rowCount,columnCount");
    await ctx.sync();

    const out = [`Workbook: ${wb.name}`, `Selected: ${sel.address} (${sel.rowCount}x${sel.columnCount})`];
    const usedPromises = [];
    for (const s of sheets.items) {
      const ur = s.getUsedRangeOrNullObject(false);
      ur.load("address,rowCount,columnCount,values");
      usedPromises.push({ sheet: s.name, ur });
    }
    await ctx.sync();
    for (const { sheet, ur } of usedPromises) {
      if (ur.isNullObject) { out.push(`Sheet "${sheet}": (empty)`); continue; }
      const maxR = Math.min(ur.rowCount, 25), maxC = Math.min(ur.columnCount, 12);
      const sample = ur.values.slice(0, maxR).map(r => r.slice(0, maxC));
      out.push(`Sheet "${sheet}": ${ur.address}, sample(JSON)=${JSON.stringify(sample)}`);
    }
    return out.join("\n");
  });
}

// ---------- action executor ----------
async function runActions(actions) {
  return Excel.run(async (ctx) => {
    const wb = ctx.workbook;
    const logs = [];
    for (const a of actions || []) {
      try {
        const s = a.sheet ? wb.worksheets.getItemOrNullObject(a.sheet) : wb.worksheets.getActiveWorksheet();
        s.load("name");
        await ctx.sync();
        const ws = (s.isNullObject || !a.sheet) ? wb.worksheets.getActiveWorksheet() : s;
        if (a.type === "writeFormula" && a.cell) {
          ws.getRange(a.cell).formulas = [[a.formula]]; logs.push(`✔ formula ${a.sheet}!${a.cell}`);
        } else if (a.type === "writeValues" && a.cell && Array.isArray(a.values)) {
          ws.getRange(a.cell).getResizedRange(a.values.length - 1, a.values[0].length - 1).values = a.values;
          logs.push(`✔ values ${a.sheet}!${a.cell} (${a.values.length} rows)`);
        } else if (a.type === "clearRange" && a.range) {
          ws.getRange(a.range).clear(Excel.ClearApplyTo.contents); logs.push(`✔ cleared ${a.sheet}!${a.range}`);
        } else if (a.type === "formatRange" && a.range && a.format) {
          const r = ws.getRange(a.range);
          if (a.format.numberFormat) r.numberFormat = [[a.format.numberFormat]];
          if (a.format.bold) r.format.font.bold = true;
          if (a.format.fillColor) r.format.fill.color = a.format.fillColor;
          logs.push(`✔ formatted ${a.sheet}!${a.range}`);
        } else logs.push(`⚠ ignored: ${JSON.stringify(a)}`);
      } catch (e) { logs.push(`✖ error: ${a.type}: ${e.message || e}`); }
    }
    await ctx.sync();
    return logs;
  });
}

// ---------- Mistral call ----------
async function askMistral(context, prompt, history) {
  const res = await fetch("https://api.mistral.ai/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${MISTRAL_KEY}` },
    body: JSON.stringify({
      model: MODEL, temperature: 0,
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        ...history.slice(-6),
        { role: "user", content: `WORKBOOK CONTEXT:\n${context}\n\nUSER PROMPT:\n${prompt}` }
      ]
    })
  });
  if (!res.ok) throw new Error(`Mistral API ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.choices?.[0]?.message?.content ?? "";
}

// ---------- UI ----------
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const btn = document.getElementById("send");
const keyEl = document.getElementById("key");
const ctxEl = document.getElementById("ctx");
let history = [];

keyEl.value = MISTRAL_KEY;
keyEl.addEventListener("change", () => {
  MISTRAL_KEY = keyEl.value.trim();
  localStorage.setItem("mistral_key", MISTRAL_KEY);
});

function addMsg(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const prompt = input.value.trim();
  if (!prompt) return;
  if (!MISTRAL_KEY) { addMsg("⚠️ Enter your Mistral API key first.", "err"); return; }
  input.value = "";
  btn.disabled = true;
  addMsg(prompt, "user");
  const status = addMsg("…", "bot");
  try {
    const context = await getContext();
    ctxEl.textContent = context;
    const raw = await askMistral(context, prompt, history);
    const m = raw.match(/\{[\s\S]*\}/);
    let parsed;
    try { parsed = m ? JSON.parse(m[0]) : { reply: raw, actions: [] }; }
    catch { parsed = { reply: raw, actions: [] }; }
    history.push({ role: "user", content: prompt }, { role: "assistant", content: raw });
    let logs = [];
    try { logs = await runActions(parsed.actions); } catch (e) { logs = [`✖ ${e.message}`]; }
    status.textContent = parsed.reply || "(no reply)";
    if (logs.length) {
      const l = document.createElement("div");
      l.className = "msg log";
      l.textContent = logs.join("\n");
      chat.appendChild(l);
    }
  } catch (e) {
    status.className = "msg bot err";
    status.textContent = "Error: " + (e.message || e);
  } finally { btn.disabled = false; chat.scrollTop = chat.scrollHeight; }
}

btn.addEventListener("click", send);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

Office.onReady(() => addMsg("Ready. I can see your live workbook — ask me to build formulas, fill data, or format ranges.", "bot"));
</script>
</body>
</html>
